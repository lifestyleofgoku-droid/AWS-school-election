<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Principal Dashboard</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- SCHOOL HEADER -->
    <header>
        <img src="./images/arunachala-logo.png"
             alt="Arunachala World School CSE">

        <h1>ARUNACHALA WORLD SCHOOL</h1>

        <p>CSE PRINCIPAL LIVE VOTE COUNT</p>
    </header>


    <!-- VOTE COUNT TABLE -->

    <h2 style="text-align:center; margin:30px 0 20px; color:#7b2a91;">
        Principal Live Vote Count
    </h2>

    <table style="
        width:90%;
        max-width:800px;
        margin:auto;
        border-collapse:collapse;
        background:white;
        box-shadow:0 5px 15px rgba(0,0,0,0.12);
        border-radius:10px;
        overflow:hidden;
    ">

        <tr>
            <th style="
                background:#7b2a91;
                color:white;
                padding:15px;
                font-size:18px;
            ">
                Contestant
            </th>

            <th style="
                background:#7b2a91;
                color:white;
                padding:15px;
                font-size:18px;
            ">
                Votes
            </th>
        </tr>


        <tr>
            <td style="padding:15px; text-align:center;">
                Contestant 1
            </td>

            <td id="c1" style="padding:15px; text-align:center;">
                0
            </td>
        </tr>


        <tr>
            <td style="padding:15px; text-align:center;">
                Contestant 2
            </td>

            <td id="c2" style="padding:15px; text-align:center;">
                0
            </td>
        </tr>


        <tr>
            <td style="padding:15px; text-align:center;">
                Contestant 3
            </td>

            <td id="c3" style="padding:15px; text-align:center;">
                0
            </td>
        </tr>


        <tr>
            <td style="padding:15px; text-align:center;">
                Contestant 4
            </td>

            <td id="c4" style="padding:15px; text-align:center;">
                0
            </td>
        </tr>

    </table>


    <!-- ADMIN JAVASCRIPT -->
    <script type="module" src="./js/admin.js"></script>

</body>
</html>
