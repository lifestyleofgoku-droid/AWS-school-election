<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arunachala World School Election</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- SCHOOL HEADER -->
    <header>

        <img src="./images/arunachala-logo.png"
             alt="Arunachala World School ICSE">

        <h1>ARUNACHALA WORLD SCHOOL</h1>

        <p>CSE SCHOOL LEADER ELECTION</p>

    </header>


    <!-- INSTRUCTIONS -->
    <div style="
        text-align:center;
        margin:25px 15px 10px;
        color:#555;
        font-size:17px;
    ">
        Select your leader by tapping one candidate.
    </div>


    <!-- CANDIDATES -->
    <div id="candidateContainer">
        <!-- Candidates will appear automatically -->
    </div>


    <!-- MESSAGE -->
    <div id="message"></div>


    <!-- FIREBASE -->
    <script type="module" src="./js/firebase-config.js"></script>

    <!-- MAIN SCRIPT -->
    <script type="module" src="./js/script.js"></script>

</body>

</html>
